# /etc/nginx/snippets/eerc-proxy.conf — 反向代理共用設定
#   sudo cp deploy/ubuntu/nginx/eerc-proxy.conf /etc/nginx/snippets/eerc-proxy.conf

proxy_pass http://eerc_app;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# ⚠️ 用 $remote_addr「覆寫」而不是附加：網站程式取 X-Forwarded-For 的第一個值當作使用者 IP
# 來做登入／聯絡表單的頻率限制。若改成 $proxy_add_x_forwarded_for，使用者可以自己塞一個假 IP
# 在最前面，繞過頻率限制。
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

proxy_connect_timeout 10s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
