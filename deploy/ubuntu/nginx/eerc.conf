# /etc/nginx/sites-available/eerc.conf
# 基隆市英語資源中心網站 — Nginx 反向代理設定（Ubuntu Server 24.04 / Nginx 1.24）
#
# 安裝：
#   sudo cp deploy/ubuntu/nginx/eerc.conf /etc/nginx/sites-available/eerc.conf
#   sudo ln -sf /etc/nginx/sites-available/eerc.conf /etc/nginx/sites-enabled/eerc.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 需依實際環境修改的地方（搜尋 ★）：
#   ★1 server_name：正式網域
#   ★2 ssl_certificate / ssl_certificate_key：教網中心提供的憑證路徑
#
# 注意：
#   - Nginx 1.24 不支援 `http2 on;`（1.25.1 以後才有），所以寫在 listen 那一行。
#   - 主要安全標頭（CSP、HSTS…）由網站程式的 middleware 輸出，這裡不重複加，避免標頭出現兩次。
#     只有 /uploads/ 與 /_next/static/ 這兩種「Nginx 直接提供、不經過網站程式」的路徑在這裡補標頭。

upstream eerc_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# 登入端點限流：每個 IP 每分鐘 10 次（程式內另有 15 分鐘 10 次的限制，兩層防護）
limit_req_zone $binary_remote_addr zone=eerc_login:10m rate=10r/m;

# HTTP → HTTPS
server {
    listen 80;
    # listen [::]:80;   # 主機有 IPv6 才打開（先用 `ip -6 addr` 確認），否則 Nginx 會啟動失敗
    server_name englishcenter.kl.edu.tw;   # ★1

    # 申請／續約憑證用（若教網中心直接提供憑證檔，可刪除這段）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name englishcenter.kl.edu.tw;   # ★1

    ssl_certificate     /etc/ssl/eerc/fullchain.pem;   # ★2 憑證＋中繼憑證
    ssl_certificate_key /etc/ssl/eerc/privkey.pem;     # ★2 私鑰（權限 600，擁有者 root）

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;            # 不顯示 Nginx 版本
    client_max_body_size 12m;     # 程式上限 10MB，留一點餘裕給表單其他欄位

    access_log /var/log/nginx/eerc.access.log;
    error_log  /var/log/nginx/eerc.error.log warn;

    # ── 阻擋常見探測路徑 ──
    location ~ /\.(?!well-known) { return 404; }          # .env、.git 等
    location ~* \.(env|ini|log|sql|bak|sh)$ { return 404; }
    location ~* ^/(wp-admin|wp-login|phpmyadmin|xmlrpc\.php) { return 404; }

    # ── 上傳檔案：由 Nginx 直接從磁碟提供（不經過網站程式）──
    # 後台上傳的檔案寫在 UPLOAD_DIR=/srv/eerc/uploads，放在發佈目錄以外，
    # 這樣每次部署新版本都不會讓舊的上傳檔「消失」。
    location /uploads/ {
        alias /srv/eerc/uploads/;
        # 只提供檔案，絕不執行任何東西
        location ~* \.(php|phtml|pl|py|cgi|sh|html?|svg|js)$ { return 403; }
        add_header X-Content-Type-Options "nosniff" always;
        # 不加 CSP sandbox：Chrome 會因此拒絕顯示 PDF。防護改靠上面的副檔名封鎖＋nosniff，
        # 以及上傳程式「副檔名由 MIME 白名單決定」（見 src/app/api/upload/route.ts）。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ── Next.js 編譯後的靜態檔（檔名含雜湊，可長期快取）──
    location /_next/static/ {
        proxy_pass http://eerc_app;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 登入 API 限流 ──
    location = /api/auth/login {
        limit_req zone=eerc_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/eerc-proxy.conf;
    }

    # ── 其餘全部交給網站程式 ──
    location / {
        include /etc/nginx/snippets/eerc-proxy.conf;
    }
}
